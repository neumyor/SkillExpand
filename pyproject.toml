[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillexpand"
version = "0.1.0"
description = "Experience-driven skill discovery and independent candidate review"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy<2", "scipy", "gym==0.26.2", "omegaconf==2.3.0",
  "joblib==1.2.0", "pandas==1.5.3", "python-dotenv==1.0.0",
  "langchain==0.0.181", "openai==0.27.7", "pydantic<2",
  "tiktoken==0.4.0", "wikipedia==1.4.0",
]

[project.optional-dependencies]
alfworld = ["alfworld==0.4.2", "textworld[pddl]==1.6.2"]
"tencent-relay" = ["e2b>=1.0"]
dev = ["pytest>=7,<9", "ruff>=0.6"]

[project.scripts]
skillexpand = "skillexpand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillexpand = ["configs/agent/*.yaml", "configs/benchmark/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_alfworld_l1_smoke.py"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
